[project]
name = "ssl-based-embedding"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "don-gik", email = "224256443+don-gik@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.1",
    "hydra-core>=1.3.5",
    "lightning>=2.6.5",
    "nltk>=3.10.3",
    "omegaconf>=2.3.1",
    "sentence-transformers>=6.0.0",
    "torch>=2.6.0",
    "transformers>=5.15.1",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"src" = "src"


[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
fixable = ["ALL"]
